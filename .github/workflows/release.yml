name: Release Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Release Assets & Publish
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore YDM.sln

    - name: Run Test Suite
      run: dotnet test tests/YDM.Tests/YDM.Tests.csproj --configuration Release --verbosity normal

    - name: Publish Self-Contained Desktop App
      run: |
        dotnet publish src/YDM.UI/YDM.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/ui
        dotnet publish src/YDM.Host/YDM.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/host

    - name: Package Portable ZIP
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist -Force | Out-Null
        Copy-Item -Path publish/host/YDM.Host.exe -Destination publish/ui/
        Copy-Item -Path host/com.ydm.downloader.json -Destination publish/ui/
        Compress-Archive -Path publish/ui/* -DestinationPath dist/ydm-${{ github.ref_name }}-win-x64-portable.zip

    - name: Generate Checksums
      shell: pwsh
      run: |
        Get-ChildItem -Path dist/* | ForEach-Object {
          $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($_.Name)" | Out-File -FilePath dist/checksums.txt -Append -Encoding UTF8
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        draft: false
        prerelease: false
        generate_release_notes: true
