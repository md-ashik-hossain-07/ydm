<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 16px;
      color: #333;
      background: #fafafa;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #0067c0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .status-online { background: #d4edda; color: #155724; }
    .status-offline { background: #f8d7da; color: #721c24; }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid #e9ecef;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #0067c0; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <h3>YDM Integration</h3>
  <div id="status" class="status-badge status-offline">Connecting to YDM...</div>

  <div class="setting-row">
    <span>Automatic Interception</span>
    <label class="switch">
      <input type="checkbox" id="interceptToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Send Domain Cookies</span>
    <label class="switch">
      <input type="checkbox" id="cookieToggle">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
